<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">Training-to-deployment pipeline</title>
  <desc id="desc">PyTorch training is exported to Float32 ONNX, statically quantized, converted to embedded code by X-CUBE-AI, and run on an STM32F446RE.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="line" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
  </defs>
  <style>
    .box { fill: none; stroke: #d0d7de; stroke-width: 2; }
    .heading { fill: #1f2328; font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    .detail { fill: #59636e; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 2; marker-end: url(#arrow); }
    .line { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .box { stroke: #3d444d; }
      .heading { fill: #f0f6fc; }
      .detail { fill: #9198a1; }
      .arrow { stroke: #9198a1; }
      .line { fill: #9198a1; }
    }
  </style>

  <path class="arrow" d="M 220 80 H 250"/>
  <path class="arrow" d="M 460 80 H 490"/>
  <path class="arrow" d="M 700 80 H 730"/>
  <path class="arrow" d="M 940 80 H 970"/>

  <g transform="translate(10 25)">
    <rect class="box" width="210" height="110" rx="4"/>
    <text class="heading" x="105" y="49">PyTorch</text>
    <text class="detail" x="105" y="77">training</text>
  </g>
  <g transform="translate(250 25)">
    <rect class="box" width="210" height="110" rx="4"/>
    <text class="heading" x="105" y="49">Float32</text>
    <text class="detail" x="105" y="77">ONNX</text>
  </g>
  <g transform="translate(490 25)">
    <rect class="box" width="210" height="110" rx="4"/>
    <text class="heading" x="105" y="49">Static</text>
    <text class="detail" x="105" y="77">quantization</text>
  </g>
  <g transform="translate(730 25)">
    <rect class="box" width="210" height="110" rx="4"/>
    <text class="heading" x="105" y="49">X-CUBE-AI</text>
    <text class="detail" x="105" y="77">code generation</text>
  </g>
  <g transform="translate(970 25)">
    <rect class="box" width="220" height="110" rx="4"/>
    <text class="heading" x="110" y="49">STM32F446RE</text>
    <text class="detail" x="110" y="77">inference</text>
  </g>
</svg>
