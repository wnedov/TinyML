<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">TinyML deployment summary</title>
  <desc id="desc">The seven-class model reaches 99.43 percent test accuracy, runs in 9 to 10 milliseconds on an STM32F446RE, uses 7.42 KiB runtime RAM, and requires 271,563 MACs per inference.</desc>
  <style>
    .panel { fill: none; stroke: #d0d7de; }
    .accent { fill: #0969da; }
    .value { fill: #1f2328; font: 600 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .detail { fill: #59636e; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { stroke: #3d444d; }
      .accent { fill: #4493f8; }
      .value, .label { fill: #f0f6fc; }
      .detail { fill: #9198a1; }
    }
  </style>
  <g transform="translate(24 25)">
    <rect class="panel" width="270" height="200" rx="8"/>
    <rect class="accent" width="270" height="6" rx="3"/>
    <text class="label" x="24" y="51">Test accuracy</text>
    <text class="value" x="24" y="105">99.43%</text>
    <text class="detail" x="24" y="143">Quantized ONNX</text>
    <text class="detail" x="24" y="167">Digits 0–6</text>
  </g>

  <g transform="translate(318 25)">
    <rect class="panel" width="270" height="200" rx="8"/>
    <rect class="accent" width="270" height="6" rx="3"/>
    <text class="label" x="24" y="51">On-device latency</text>
    <text class="value" x="24" y="105">9–10 ms</text>
    <text class="detail" x="24" y="143">STM32F446RE</text>
    <text class="detail" x="24" y="167">Measured at 180 MHz</text>
  </g>

  <g transform="translate(612 25)">
    <rect class="panel" width="270" height="200" rx="8"/>
    <rect class="accent" width="270" height="6" rx="3"/>
    <text class="label" x="24" y="51">Runtime RAM</text>
    <text class="value" x="24" y="105">7.42 KiB</text>
    <text class="detail" x="24" y="143">Activations</text>
    <text class="detail" x="24" y="167">plus input/output buffers</text>
  </g>

  <g transform="translate(906 25)">
    <rect class="panel" width="270" height="200" rx="8"/>
    <rect class="accent" width="270" height="6" rx="3"/>
    <text class="label" x="24" y="51">Compute</text>
    <text class="value" x="24" y="105">271,563</text>
    <text class="detail" x="24" y="143">MACs</text>
    <text class="detail" x="24" y="167">per inference</text>
  </g>
</svg>
